name: Reconstitute olive sprites

on:
  workflow_dispatch:
  push:
    branches: ["oliva"]
    paths:
      - "public/art/b64/**"
      - "scripts/materialize-art.mjs"
      - ".github/workflows/materialize-art.yml"

permissions:
  contents: write

jobs:
  sprites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Decode PNG sprites
        run: node scripts/materialize-art.mjs
      - name: Commit PNG sprites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/art/*.png
          if git diff --cached --quiet; then
            echo "Sprites already present"
            exit 0
          fi
          git commit -m "Reconstitue les sprites PNG de l'oliveraie."
          git push
